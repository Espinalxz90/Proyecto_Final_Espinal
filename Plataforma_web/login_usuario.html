<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU_IA - Iniciar Sesión</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="login_usuario">

  <div class="container">
    <!-- Encabezado y menú principal -->
    <header>
      <a class="logo" href="index.html">
        <div class="logo-icon"></div>
        <span>EDU_IA</span>
      </a>
      <nav>
        <ul id="menuNav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="modulos.html?id=1">Módulos</a></li>
          <li><a href="autoevaluacion.html?id=1">Autoevaluación</a></li>
          <li><a href="login_usuario.html">Iniciar Sesión</a></li>
          <li><a href="login.html">Admin</a></li>
        </ul>
      </nav>
    </header>

    <!-- Formulario de inicio de sesión para el usuario -->
    <section class="card panel">
      <div class="login-box">
        <h2 style="margin-bottom:6px">Iniciar Sesión</h2>
        <p class="desc" style="margin-bottom:14px">Ingresa a tu cuenta para guardar y consultar tu progreso.</p>
        <form class="formulario caja" onsubmit="iniciarSesionUsuario(event)">
          <label for="usuCorreo">Correo electrónico:</label>
          <input type="email" id="usuCorreo" placeholder="estudiante@correo.com" required>
          <label for="usuPass">Contraseña:</label>
          <input type="password" id="usuPass" placeholder="••••••••" required>
          <div class="acciones" style="margin-top:4px">
            <a class="btn sec" href="index.html">&lt;- Volver</a>
            <button type="submit" class="btn">Entrar</button>
          </div>
          <p class="nota" style="text-align:center;margin-top:4px">
            ¿Aún no tienes cuenta? <a href="registro.html" style="color:#1e3a8a;font-weight:bold">Regístrate gratis aquí</a>
          </p>
          <div class="banner error" id="errorLoginUsuario"></div>
        </form>
      </div>
    </section>

    <!-- Pie de página -->
    <footer>
      EDU_IA — Plataforma Web de Educación y Uso Responsable de Inteligencia Artificial
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
