<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDU_IA - Acceso Administrador</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="login">

  <div class="container">
    <!-- Encabezado y menú principal -->
    <header>
      <a class="logo" href="index.html">
        <div class="logo-icon"></div>
        <span>EDU_IA</span>
      </a>
      <nav>
        <ul id="menuNav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="modulos.html?id=1">Módulos</a></li>
          <li><a href="autoevaluacion.html?id=1">Autoevaluación</a></li>
          <li><a href="login_usuario.html">Iniciar Sesión</a></li>
          <li><a href="login.html">Admin</a></li>
        </ul>
      </nav>
    </header>

    <!-- Formulario de inicio de sesión para el administrador -->
    <section class="card panel">
      <div class="login-box">
        <h2 style="margin-bottom:6px">Acceso de Administrador</h2>
        <p class="desc" style="margin-bottom:14px">Ingresa tus credenciales para gestionar los contenidos de EDU_IA.</p>
        <form class="formulario caja" onsubmit="iniciarSesionAdmin(event)">
          <label for="adminCorreo">Correo electrónico:</label>
          <input type="email" id="adminCorreo" placeholder="admin@eduia.com" required>
          <label for="adminPass">Contraseña:</label>
          <input type="password" id="adminPass" placeholder="••••••••" required>
          <div class="acciones" style="margin-top:4px">
            <a class="btn sec" href="index.html">&lt;- Cancelar</a>
            <button type="submit" class="btn">Iniciar Sesión</button>
          </div>
          <div class="banner error" id="errorLogin"></div>
        </form>
      </div>
    </section>

    <!-- Pie de página -->
    <footer>
      EDU_IA — Plataforma Web de Educación y Uso Responsable de Inteligencia Artificial
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
